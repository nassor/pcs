# cargo-nextest configuration. Reference: https://nexte.st/docs/configuration/reference/.
#
# Two profiles:
# - `default`: the everyday-iteration profile. Skips every test that needs a
#   Docker daemon: the testcontainers-backed connector suites, the Raft-chaos
#   suites, and the connector/transformer/processor matrix in
#   pcs-service::connector_matrix. `cargo nextest run --workspace
#   --all-features` finishes in seconds and is safe to run constantly.
# - `ci`: the full profile. Runs every test nextest discovers, including the
#   ones `default` skips and any `#[ignore]`d test, via
#   `cargo nextest run --workspace --all-features --profile ci --run-ignored all`.
#   Reserved for CI and for the final verification step of a plan, not for
#   routine local runs. connector_matrix's one test is itself `#[ignore]`d,
#   so `--profile ci` without `--run-ignored` skips it too; it reaches CI
#   only through its own job, which passes `--profile ci` explicitly:
#   `--test` selects a cargo build target, not a nextest filter, so it
#   cannot bypass `default`'s `default-filter`, which excludes the binary
#   outright; only switching to `ci`'s `default-filter = "all()"` does.
#
# `cargo test --workspace --all-features --doc` still runs on its own:
# nextest does not execute doctests.

[profile.default]
# Excluded whole binaries are entirely testcontainers-driven: every test in
# the file starts a container (see docs/content/connectors/kafka.md and
# nats.md, and crates/pcs-connector-postgresql/tests/common/mod.rs), or, for
# the three Raft suites, a Toxiproxy container plus an N-node cluster.
# pcs-service::connector_matrix starts one container apiece for Kafka, NATS,
# PostgreSQL and MinIO/S3 and holds all four for its whole process. Excluded
# test() clauses pick out the one Docker-backed test inside an otherwise-fast
# file: kafka_service.rs, nats_service.rs, postgres_service.rs and
# s3_service.rs each pair a real-container test with a pure-config test, and
# raft_consensus_chaos.rs pairs its Docker-gated cluster tests with two
# Docker-free modules, `unit` over the state machine and its redb storage and
# `idempotency` over a single-node store, both of which stay in the fast
# profile. distributed_integration_chaos.rs's full_stack_chaos_monkey_60s
# opts out via `#[ignore]` alone, with no filter entry, and is reachable
# through `--run-ignored`. connector_matrix.rs's one test, full_matrix, is
# `#[ignore]`d too, but is also excluded here as a whole binary, so `default`
# skips it even if `--run-ignored` is passed alongside `--workspace
# --all-features`.
#
# The runner suites (distributed_scheduler, runner_chaos, checkpoint_chaos,
# wasm_chaos, distributed_processor_state) need no entry: they drive the
# in-memory fixture in tests/common/memory_store.rs, not a container.
default-filter = '''
not (
    binary_id(=pcs-connector-kafka::kafka_roundtrip)
    or binary_id(=pcs-connector-nats::nats_roundtrip)
    or binary_id(=pcs-connector-postgresql::sink)
    or binary_id(=pcs-connector-postgresql::source_cursor)
    or binary_id(=pcs-connector-postgresql::source_logical)
    or binary_id(=pcs-connector-s3::round_trip)
    or binary_id(=pcs-service::connector_matrix)
    or binary_id(=pcs-service::transport_chaos)
    or binary_id(=pcs-service::distributed_harness_smoke)
    or (binary_id(=pcs-service::raft_consensus_chaos) and not (test(/^unit::/) or test(/^idempotency::/)))
    or (binary_id(=pcs-service::kafka_service) and test(=a_kafka_source_and_sink_move_rows_through_the_standalone_runner))
    or (binary_id(=pcs-service::nats_service) and test(=a_nats_source_and_sink_move_rows_through_the_standalone_runner))
    or (binary_id(=pcs-service::postgres_service) and test(=a_postgres_source_and_sink_move_rows_through_the_standalone_runner))
    or (binary_id(=pcs-service::s3_service) and test(=an_s3_source_and_sink_move_rows_through_the_standalone_runner))
)
'''

[profile.ci]
default-filter = "all()"
# The heaviest Docker chaos tests run past nextest's default 60s slow
# threshold (transport_chaos's bandwidth test allows up to 60s for the
# follower to reconverge on top of container startup, and
# full_stack_chaos_monkey_60s takes ~70-100s), so raise it to keep CI output
# from being spuriously flagged SLOW. Nothing here terminates a test early.
slow-timeout = "180s"

# Each Raft chaos test starts its own Toxiproxy container plus an N-node
# cluster with one proxy per directed edge, then asserts on election and
# log-convergence deadlines. pcs-service::connector_matrix starts one
# container apiece for Kafka, NATS, PostgreSQL and MinIO/S3 and drives every
# source/sink/transformer/processor-runtime combination against them
# concurrently in one process. Unlike the other connector suites, which each
# need only their own container, every binary in this group holds multiple
# containers or enough host CPU at once to saturate the Docker daemon, so
# the group takes the machine one binary at a time.
# raft_consensus_chaos.rs's `unit` and `idempotency` modules drive a local
# redb file, contend for nothing, and are left out of the group. The group
# name covers both kinds of heavy Docker test: the Raft chaos suites and the
# connector matrix.
[test-groups.heavy-docker]
max-threads = 1

[[profile.default.overrides]]
filter = 'binary_id(=pcs-service::transport_chaos) or (binary_id(=pcs-service::raft_consensus_chaos) and not (test(/^unit::/) or test(/^idempotency::/))) or binary_id(=pcs-service::distributed_harness_smoke) or binary_id(=pcs-service::distributed_integration_chaos) or binary_id(=pcs-service::connector_matrix)'
test-group = "heavy-docker"

# pcs-service::connector_matrix runs four container startups end to end
# behind the whole source x sink x transformer x processor-runtime product,
# past the 180s default set above; with no override of its own every run
# would be flagged SLOW for reporting a real result, not a hang. Placed
# before the heavy-docker override below so it wins `slow-timeout`: that
# override still supplies `test-group`, because nextest resolves each
# setting independently against the first matching override that specifies
# it.
[[profile.ci.overrides]]
filter = 'binary_id(=pcs-service::connector_matrix)'
slow-timeout = "900s"

[[profile.ci.overrides]]
filter = 'binary_id(=pcs-service::transport_chaos) or (binary_id(=pcs-service::raft_consensus_chaos) and not (test(/^unit::/) or test(/^idempotency::/))) or binary_id(=pcs-service::distributed_harness_smoke) or binary_id(=pcs-service::distributed_integration_chaos) or binary_id(=pcs-service::connector_matrix)'
test-group = "heavy-docker"
