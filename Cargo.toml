[workspace]
members = [
    "crates/pcs-core",
    "crates/pcs-guest",
    "crates/pcs-guest-smoketest",
    "crates/pcs-service",
    "examples/wasm/order_processing",
]
resolver = "2"

[workspace.package]
rust-version = "1.95.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[workspace.dependencies]
# Arrow core sub-crates — exact pins enforced at workspace level.
# `arrow-ipc` is exact-pinned because it defines the on-disk checkpoint format.
# Bump explicitly after validating round-trip reads against an existing checkpoint store.
# arrow-buffer / arrow-arith / arrow-ord are exact-pinned: tightly coupled to arrow memory layout.
arrow-array   = { version = "59.2.0" }
arrow-schema  = { version = "59.2.0" }
arrow-buffer  = { version = "=59.2.0" }
arrow-select  = { version = "59.2.0" }
arrow-cast    = { version = "59.2.0" }
arrow-arith   = { version = "=59.2.0" }
arrow-ord     = { version = "=59.2.0" }
arrow-ipc     = { version = "=59.2.0" }
arrow-json    = { version = "59.2.0" }
arrow-csv     = { version = "59.2.0" }
parquet       = { version = "=59.2.0", default-features = false, features = ["arrow", "snap"] }
serde_arrow   = { version = "0.15.0", features = ["arrow-59"] }

# Common runtime deps
async-trait   = { version = "0.1.92" }
tokio         = { version = "1.53.1", features = ["macros", "sync", "time", "rt-multi-thread", "signal"] }
tokio-util    = { version = "0.7.19", features = ["rt"] }
futures       = { version = "0.3.34" }
futures-util  = { version = "0.3.34" }
serde         = { version = "1.0.229", features = ["derive"] }
serde_json    = { version = "1.0.151" }
serde_bytes   = { version = "0.11.19" }
tracing       = { version = "0.1.44" }
rayon         = { version = "1.12.0" }
num_cpus      = { version = "1.17.0" }
fnv           = { version = "1.0.7" }
rand          = { version = "0.10.2" }
uuid          = { version = "1.24.1", features = ["v4", "serde"] }

# WASM component model host
wasmtime      = { version = "47.0.3", features = ["component-model"] }
wasmtime-wasi = { version = "47.0.3" }
sha3          = { version = "0.12.0" }

# Dev / bench deps shared across crates
criterion     = { version = "0.8.2", features = ["html_reports", "async_tokio"] }
postcard      = { version = "1.1.3", features = ["alloc"] }
tempfile      = { version = "3.27.0" }
anyhow        = { version = "1.0.104" }
libc          = { version = "0.2.189" }

