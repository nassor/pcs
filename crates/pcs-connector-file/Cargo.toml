[package]
name = "pcs-connector-file"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
description = "Local-file Source and Sink for PCS. Owns the file handle, the reader thread and the channel; a transformer supplies the byte format."

[dependencies]
pcs-core        = { path = "../pcs-core", version = "0.1.0", features = ["io"] }
pcs-connector   = { path = "../pcs-connector", version = "0.1.0" }
pcs-transformer = { path = "../pcs-transformer", version = "0.1.0" }

arrow-array   = { workspace = true }
arrow-schema  = { workspace = true }
async-trait   = { workspace = true }
tokio         = { workspace = true }

[dev-dependencies]
# The formats the round-trip tests and the worked example read and write.
pcs-transformer-csv     = { path = "../pcs-transformer-csv" }
pcs-transformer-ndjson  = { path = "../pcs-transformer-ndjson" }
pcs-transformer-parquet = { path = "../pcs-transformer-parquet" }

tempfile      = { workspace = true }
tokio         = { workspace = true }

[[example]]
name = "scheduler_parquet_etl"
path = "../../examples/connectors/scheduler_parquet_etl.rs"
