[package]
name = "pcs-connector-tcp"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
description = "Live TCP Source and client-mode Sink for PCS: one length-prefixed frame per RecordBatch, in either direction. A transformer decodes and encodes the payload."

[features]
tracing = ["dep:tracing", "pcs-core/tracing"]

[dependencies]
pcs-core      = { path = "../pcs-core", version = "0.1.0", features = ["io"] }
pcs-connector = { path = "../pcs-connector", version = "0.1.0" }
pcs-transformer = { path = "../pcs-transformer", version = "0.1.0" }

arrow-array   = { workspace = true }
arrow-schema  = { workspace = true }
async-trait   = { workspace = true }
# `net` and `io-util` are not in the workspace tokio feature set; this crate
# binds a listener, dials a peer, and moves length-prefixed frames both ways.
tokio         = { workspace = true, features = ["net", "io-util"] }
tracing       = { workspace = true, optional = true }

[dev-dependencies]
# A real payload transformer, built directly by the factory tests.
pcs-transformer-arrow-ipc = { path = "../pcs-transformer-arrow-ipc" }

tokio         = { workspace = true }
