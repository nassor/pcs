[package]
name = "pcs-connector"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
description = "Factory contract every PCS connector implements: SourceFactory, SinkFactory, the ConnectorContext that resolves byte formats, and the shared schema_fields parser."

[dependencies]
pcs-core        = { path = "../pcs-core", version = "0.1.0", features = ["io"] }
pcs-transformer = { path = "../pcs-transformer", version = "0.1.0" }

arrow-schema  = { workspace = true }
# `ConfigValue` is part of the factory signature, so every connector and the
# host that loads it must agree on one version of this crate.
pcs-config    = { path = "../pcs-config", version = "0.1.0" }
