[package]
name = "pcs-guest"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Guest SDK for PCS WebAssembly Component Model pipelines. Provides the WIT package pcs:pipeline@0.2.0 and the export_pipeline! macro."

# pcs-guest is an rlib, not a component. Downstream guest crates depend on it,
# then run `cargo component build` on THEIR crate to produce the wasm component.
# cargo-component picks up `crates/pcs-guest/wit/` via the downstream crate's
# `[package.metadata.component.target.path]` pointing here. The
# `export_pipeline!` macro expands into code that references `crate::bindings`,
# i.e. the caller's cargo-component-generated bindings, not pcs-guest's.
[lib]
crate-type = ["rlib"]

[features]
# `guest` is a no-op forwarder: pcs-guest already hardcodes `features = ["guest"]`
# on its pcs-core dep below. It exists only so external tooling can pass
# `--features guest` without cargo rejecting an unknown feature.
default = []
guest = []

[dependencies]
pcs-core     = { path = "../pcs-core", default-features = false, features = ["guest"] }
arrow-array  = { workspace = true }
arrow-schema = { workspace = true }
arrow-ipc    = { workspace = true }
# serde is a dependency only for the `Serialize`/`Deserialize` bounds on
# `__rt::Stateful<C>`; see lib.rs for why it is not re-exported.
serde        = { workspace = true }
# pollster re-exported under pcs_guest::__rt::pollster so the macro can drive
# Pipeline::run_on (async fn) inside the sync WIT export without forcing users
# to depend on pollster themselves. Matches pcs-core's `guest` feature pin.
pollster     = { version = "0.4" }
