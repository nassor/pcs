[package]
name = "pcs-inspector-wire"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "The JSON contract the pcs-service inspector serves and the pcs-service-ui dashboard consumes."
license.workspace = true
repository.workspace = true
homepage.workspace = true

# serde only, no std-network or platform dependency: the dashboard compiles this
# crate for wasm32-unknown-unknown, so anything more would not build there.
[dependencies]
serde = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
