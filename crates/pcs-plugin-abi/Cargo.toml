[package]
name = "pcs-plugin-abi"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The C ABI a PCS native plugin exports: two entry symbols, four vtable calls, Arrow IPC in and out. Dependency-free so a host and a guest can share it."

# An rlib on both sides of the boundary. The host links it to call a plugin; a
# Rust plugin links it to be called. Nothing here allocates or touches the
# Arrow crates, so neither side inherits a dependency from the other.
[lib]
crate-type = ["rlib"]

