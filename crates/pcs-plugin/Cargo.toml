[package]
name = "pcs-plugin"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Guest SDK for PCS native plugins. Wires a Pipeline to the pcs-plugin-abi C ABI with the export_plugin! macro."

# An rlib. A downstream plugin crate depends on this and sets its own
# `crate-type = ["cdylib"]`, because the exported C symbols have to come from
# the final shared library, not from here.
[lib]
crate-type = ["rlib"]

[dependencies]
pcs-plugin-abi = { path = "../pcs-plugin-abi" }
# Default features on purpose: a native plugin is a host-side shared library, so
# it keeps `runtime` and the rayon stage parallelism that comes with it. Taking
# this dependency through pcs-guest instead would pin it to `guest` and silently
# drop that.
pcs-core       = { path = "../pcs-core" }

arrow-array    = { workspace = true }
arrow-schema   = { workspace = true }
arrow-ipc      = { workspace = true }

serde          = { workspace = true }
serde_json     = { workspace = true }
base64         = { workspace = true }
# Drives the async `Pipeline::run_on_with_stats` from inside the synchronous C
# ABI entry points. Matches the executor pcs-guest uses for the same reason.
pollster       = { version = "0.4" }
