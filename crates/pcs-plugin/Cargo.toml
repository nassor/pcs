[package]
name = "pcs-plugin"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
description = "Processor SDK for PCS native plugins. Wires a Pipeline to the pcs-plugin-abi C ABI with the export_plugin! macro."

# An rlib. A downstream plugin crate depends on this and sets its own
# `crate-type = ["cdylib"]`, because the exported C symbols have to come from
# the final shared library, not from here.
[lib]
crate-type = ["rlib"]

[features]
# Forwards pcs-core's `windows` feature so a plugin crate can implement its
# windowing logic with the same primitives the host uses: WindowSpec,
# WatermarkState, WindowedSystemBuilder and friends. Enables
# `pcs_plugin::windows`.
windows = ["pcs-core/windows"]

[dependencies]
pcs-plugin-abi = { path = "../pcs-plugin-abi", version = "0.1.0" }
# Default features on purpose: a native plugin is a host-side shared library, so
# it keeps `runtime` and the rayon stage parallelism that comes with it. Taking
# this dependency through pcs-processor instead would pin it to `processor` and silently
# drop that.
pcs-core       = { path = "../pcs-core", version = "0.1.0" }

arrow-array    = { workspace = true }
arrow-schema   = { workspace = true }
arrow-ipc      = { workspace = true }

serde          = { workspace = true }
serde_json     = { workspace = true }
base64         = { workspace = true }
# Drives the async `Pipeline::run_on_with_stats` from inside the synchronous C
# ABI entry points. Matches the executor pcs-processor uses for the same reason.
pollster       = { version = "1.0.1" }
