[package]
name = "pcs-processor-smoketest"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# CI fixture, not a library a downstream consumer would depend on.
publish = false
description = "Minimal pcs-processor consumer used as a build fixture and Arrow IPC round-trip fixture."

# This crate exists to verify:
#   1. `cargo build -p pcs-processor-smoketest --target wasm32-wasip2`
#      produces a valid WebAssembly component against the pcs-pipeline world.
#   2. The `export_pipeline!` macro in pcs-processor expands cleanly against
#      `wit_bindgen::generate!`-generated `crate::bindings`.
#   3. arrow-ipc stays pinned at the exact workspace version between host and
#      processor. This crate is a workspace member, so the pin propagates through
#      the dep graph.
#
# On the host target, the `export_pipeline!` invocation is gated behind
# `#[cfg(target_arch = "wasm32")]` in src/lib.rs, so `cargo check --workspace`
# compiles this as an empty cdylib: no reference to `crate::bindings` exists on
# the host target and the crate stays green in the normal workspace build.
[lib]
crate-type = ["cdylib"]

[dependencies]
pcs-processor  = { path = "../pcs-processor" }
serde          = { workspace = true }

# The bindings generator. Gated on wasm32 because `src/lib.rs` gates the
# generated module the same way: the host build of this crate is an empty cdylib
# and has no use for the generator or its proc-macro dependency tree.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen    = { workspace = true }
