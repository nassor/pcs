[package]
name = "pcs-service"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "The pcs-service binary: TOML configuration, factory registry, axum HTTP control plane, and built-in standalone & Raft cluster runners."
license.workspace = true

[features]
# The binary ships with mimalloc by default. Opt out with `--no-default-features`
# plus the features you want.
default = ["mimalloc"]
tracing = ["dep:tracing", "pcs-core/tracing"]
io = [
    "dep:arrow-json",
    "dep:arrow-csv",
    "dep:parquet",
    "pcs-core/io",
]
datafusion = ["io", "dep:datafusion"]
windows = ["pcs-core/windows"]
distributed = [
    "dep:redb", "dep:uuid", "dep:serde_json", "dep:serde_bytes", "dep:hex",
    "tokio/net", "tokio/io-util", "dep:tokio-util",
    "pcs-core/distributed",
    "pcs-core/runtime",
]
distributed-raft = ["distributed", "dep:openraft", "dep:futures-util", "dep:postcard"]
wasm = ["dep:wasmtime", "dep:wasmtime-wasi", "dep:sha3", "pcs-core/runtime"]
# Native plugin host: dlopen a shared library exporting the pcs-plugin-abi C
# ABI. `sha3` is the optional content digest for the library file, the same
# mechanism `[pipeline.wasm].sha3_256` uses for a component.
plugin = [
    "dep:pcs-plugin-abi", "dep:libloading", "dep:base64", "dep:serde_json", "dep:sha3",
    "pcs-core/runtime",
]
# Generator for the cross-language conformance corpus in
# packages/arrow-ipc-conformance/. `arrow-ipc/lz4` is enabled only here, so a
# normal build still refuses a compressed record batch: the corpus needs to
# WRITE one to prove every codec rejects it.
conformance = ["arrow-ipc/lz4", "dep:serde_json"]
service = [
    "io", "distributed", "tracing",
    "dep:toml",
    "dep:axum", "dep:tower", "dep:tower-http", "dep:tokio-util",
    "dep:tracing-subscriber",
    "dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-prometheus",
    "dep:prometheus",
    "dep:serde_json",
    "dep:clap", "dep:reqwest",
]
service-cluster = ["service", "distributed-raft"]
mimalloc = ["dep:mimalloc"]

[dependencies]
pcs-core = { path = "../pcs-core" }
pcs-plugin-abi = { path = "../pcs-plugin-abi", optional = true }

async-trait   = { workspace = true }
tokio         = { workspace = true }
futures       = { workspace = true }
futures-util  = { workspace = true, optional = true }
serde         = { workspace = true }
serde_json    = { workspace = true, optional = true }
serde_bytes   = { workspace = true, optional = true }
tracing       = { workspace = true, optional = true }
fnv           = { workspace = true }
rand          = { workspace = true }
uuid          = { workspace = true, optional = true }

wasmtime      = { workspace = true, optional = true }
wasmtime-wasi = { workspace = true, optional = true }
sha3          = { workspace = true, optional = true }
libloading    = { workspace = true, optional = true }
base64        = { workspace = true, optional = true }

redb          = { version = "4.2.0", optional = true }
openraft      = { git = "https://github.com/databendlabs/openraft", branch = "release-0.10", features = ["serde"], optional = true }
postcard      = { version = "1.1", default-features = false, features = ["alloc"], optional = true }
hex           = { version = "0.4.3", optional = true }
toml          = { version = "0.8", optional = true }
axum          = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"], optional = true }
tower         = { version = "0.5", optional = true }
tower-http    = { version = "0.6", default-features = false, features = ["trace", "timeout", "limit"], optional = true }
tokio-util    = { version = "0.7", features = ["rt"], optional = true }
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "json", "ansi"], optional = true }
opentelemetry       = { version = "0.32", optional = true }
opentelemetry_sdk   = { version = "0.32", features = ["metrics"], optional = true }
opentelemetry-prometheus = { version = "0.32", optional = true }
prometheus          = { version = "0.14", default-features = false, optional = true }
clap          = { version = "4", features = ["derive", "env"], optional = true }
reqwest       = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }

# Arrow sub-crates (always required for format impls)
arrow-array   = { workspace = true }
arrow-schema  = { workspace = true }
arrow-ipc     = { workspace = true }

# IO format deps
arrow-json    = { workspace = true, optional = true }
arrow-csv     = { workspace = true, optional = true }
parquet       = { workspace = true, optional = true }

# DataFusion integration
datafusion    = { version = "55", default-features = false, features = ["sql", "parquet"], optional = true }
mimalloc = { version = "0.1.52", optional = true }

[[bin]]
name = "pcs-service"
path = "src/bin/pcs-service/main.rs"
required-features = ["service"]

[[example]]
name = "first_pipeline"
path = "examples/first_pipeline.rs"

[[example]]
name = "scheduler_etl"
path = "examples/scheduler_etl.rs"

[[example]]
name = "scheduler_etl_parallel"
path = "examples/scheduler_etl_parallel.rs"

[[example]]
name = "scheduler_dag"
path = "examples/scheduler_dag.rs"

[[example]]
name = "scheduler_parquet_etl"
path = "examples/scheduler_parquet_etl.rs"
required-features = ["io"]

[[example]]
name = "distributed_scheduler"
path = "examples/distributed_scheduler.rs"
required-features = ["distributed"]

[[example]]
name = "datafusion_interop"
path = "examples/datafusion_interop.rs"
required-features = ["datafusion"]

[[example]]
name = "window_aggregation"
path = "examples/window_aggregation.rs"
required-features = ["windows"]

[[example]]
name = "distributed_windowed"
path = "examples/distributed_windowed.rs"
required-features = ["distributed", "windows"]

[[example]]
name = "distributed_fulfillment"
path = "examples/distributed_fulfillment/main.rs"
required-features = ["service-cluster"]

[[example]]
name = "polyglot_orders"
path = "examples/polyglot_orders.rs"
required-features = ["wasm"]

[[example]]
name = "native_plugin"
path = "examples/native_plugin.rs"
required-features = ["plugin"]

[[example]]
name = "conformance_vectors"
path = "examples/conformance_vectors.rs"
required-features = ["conformance"]

[[example]]
name = "stream_latency"
path = "examples/stream_latency.rs"
required-features = ["service"]

[[bench]]
name = "distributed"
harness = false
required-features = ["distributed"]

[[bench]]
name = "vs_datafusion_q6"
harness = false
required-features = ["datafusion"]

[dev-dependencies]
criterion     = { workspace = true }
tempfile      = { workspace = true }
serde         = { workspace = true }
postcard      = { workspace = true }
anyhow        = { workspace = true }
sha3          = { workspace = true }
libc          = { workspace = true }
pcs-polyglot-order = { path = "../../examples/polyglot/order-schema" }
serde_json    = { workspace = true }
arrow-array   = { workspace = true }
arrow-buffer  = { workspace = true }
arrow-schema  = { workspace = true }
tokio         = { workspace = true }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
uuid          = { workspace = true }
redb          = { version = "4.2.0" }
openraft      = { git = "https://github.com/databendlabs/openraft", branch = "release-0.10", features = ["serde"] }
tokio-util    = { workspace = true }
datafusion    = { version = "55", default-features = false, features = ["sql", "parquet"] }
reqwest       = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
testcontainers = "0.28"
tracing       = { workspace = true }
opentelemetry_sdk = { version = "0.32", features = ["metrics"] }
opentelemetry-prometheus = { version = "0.32" }
opentelemetry  = { version = "0.32" }
prometheus     = { version = "0.14", default-features = false }
num_cpus       = { workspace = true }
rayon          = { workspace = true }
serde_arrow    = { workspace = true }
mimalloc = "0.1.52"

