# PCS cluster service configuration, built-in factories only.
# A three-node Raft cluster with at-least-once processing. Each node runs with
# its own PCS_NODE_ID and PCS_DATA_DIR.
#
# Validate, without starting a cluster:
#   PCS_NODE_ID=1 PCS_DATA_DIR=/tmp/pcs-node-1 \
#   cargo run --features service-cluster,wasm --bin pcs-service -- validate \
#     --config examples/configs/cluster.toml
#
# Run three nodes, one per terminal or process-manager entry:
#   Terminal 1:
#     PCS_NODE_ID=1 PCS_BOOTSTRAP=true PCS_DATA_DIR=/tmp/pcs-node-1 \
#     cargo run --features service-cluster,wasm --bin pcs-service -- serve \
#       --config examples/configs/cluster.toml
#   Terminal 2:
#     PCS_NODE_ID=2 PCS_DATA_DIR=/tmp/pcs-node-2 \
#     cargo run --features service-cluster,wasm --bin pcs-service -- serve \
#       --config examples/configs/cluster.toml
#   Terminal 3:
#     PCS_NODE_ID=3 PCS_DATA_DIR=/tmp/pcs-node-3 \
#     cargo run --features service-cluster,wasm --bin pcs-service -- serve \
#       --config examples/configs/cluster.toml
#
# Components and systems have no TOML representation: the guest declares them
# through `describe()`. See crates/pcs-service/src/service/registry.rs.

# Cluster mode runs the distributed Raft runner.
mode = "cluster"

# True on initial bring-up with an empty data_dir, false for a node joining an
# existing cluster. Substitution yields a bare bool, so this file is a template
# rather than strict TOML until it runs at load time.
bootstrap = "${PCS_BOOTSTRAP:-false}"

# Invariant: lease_ttl_ms >= 3 * election_timeout_ms
lease_ttl_ms = 30000          # 30 s  (30000 >= 3 * 1500 = 4500 ✓)
election_timeout_ms = 1500    # 1.5 s
heartbeat_interval_ms = 300   # 300 ms, must be < election_timeout_ms
snapshot_log_interval = 10000 # snapshot every 10 000 committed log entries

[node]
# id is a u64; substitution yields a bare integer.
id = "${PCS_NODE_ID}"            # 1, 2, or 3, set per instance via env var
name = "pcs-node-${PCS_NODE_ID}"
data_dir = "${PCS_DATA_DIR:-/tmp/pcs-cluster}"

# All cluster members, including this node. IDs must match node.id values, and
# each addr is the Raft transport address, not the HTTP control-plane port.
[[peers]]
id = 1
addr = "10.0.0.1:9000"

[[peers]]
id = 2
addr = "10.0.0.2:9000"

[[peers]]
id = 3
addr = "10.0.0.3:9000"

# Components come from the guest's `describe()` response, so the sink's
# `source_component` below must name one of them. Build the module with
# `cargo component build --release --target wasm32-wasip2`.
[pipeline.wasm]
module = "pipelines/events.wasm"

# [[sources]] must be absent in cluster mode: the runner ingests through
# PartitionSource, so entries here make ServiceConfig::validate() fail.

# CsvSink is built-in; a real deployment would register its own sink, such as a
# Kafka or Postgres sink, in a custom binary. CsvSink creates its output file as
# soon as the factory is built, including during `validate`, so the parent
# directory must exist. The path below writes straight to /tmp.
[[sinks]]
name = "csv_events_out"
type = "CsvSink"
source_component = "events"

[sinks.config]
path = "/tmp/pcs-cluster-events-out.csv"
has_headers = true

[[sinks.config.schema_fields]]
name = "event_id"
type = "Int64"
nullable = false

[[sinks.config.schema_fields]]
name = "event_type"
type = "Utf8"
nullable = true

[[sinks.config.schema_fields]]
name = "payload"
type = "Utf8"
nullable = true

# HTTP control plane; each node binds its own port.
[http]
bind = "0.0.0.0:8080"
disabled = false

# JSON output suits structured log aggregators.
[observability]
log_format = "json"
log_level = "${LOG_LEVEL:-info}"
