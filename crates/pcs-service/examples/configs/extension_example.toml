# PCS extension example — user-defined source and sink factories.
#
# WARNING: THIS CONFIG WILL NOT RUN WITH THE STOCK pcs-service BINARY.
#
# The types used here (KafkaSource, PostgresSink) are NOT built into
# pcs-service.  You must build a custom binary that registers these factories
# via `ServiceBuilder::register_source` / `register_sink` before this config
# will work.
#
# Sources and sinks are the only factory surface: system and component
# factories were removed (see crates/pcs-service/src/service/registry.rs). The
# pipeline itself is either a WASM guest module, as below, or a
# `Box<dyn PipelineRuntime>` handed to `ServiceBuilder::with_runtime`.
#
# See examples/configs/README.md for guidance on building a custom binary.

mode = "standalone"

[node]
id = 1
name = "order-processor"
data_dir = "${PCS_DATA_DIR:-/var/lib/pcs-orders}"

[run_mode]
kind = "interval"
interval_ms = 5000   # re-run the pipeline every 5 seconds

# The pipeline is a WASM guest component; the components it declares via
# `describe()` are what `target_component` / `source_component` must name.
# A custom binary can instead call `ServiceBuilder::with_runtime` and omit the
# `[pipeline]` table entirely.
[pipeline.wasm]
module = "pipelines/order_processing.wasm"

[pipeline.wasm.config]
strict = "true"
lookup_table = "products"

# User-defined source: KafkaSource reads from a Kafka topic.
# Registered via ServiceBuilder::register_source(KafkaSourceFactory).
[[sources]]
name = "kafka_orders"
type = "KafkaSource"        # REQUIRES: KafkaSourceFactory registered
target_component = "orders"

[sources.config]
brokers = "${KAFKA_BROKERS:-localhost:9092}"
topic = "orders-raw"
group_id = "pcs-order-processor"

# User-defined sink: PostgresSink writes enriched rows to a database.
# Registered via ServiceBuilder::register_sink(PostgresSinkFactory).
[[sinks]]
name = "pg_enriched_orders"
type = "PostgresSink"        # REQUIRES: PostgresSinkFactory registered
source_component = "orders"

[sinks.config]
dsn = "${POSTGRES_DSN:-postgres://user:pass@localhost:5432/warehouse}"
table = "enriched_orders"

[http]
bind = "0.0.0.0:8080"
disabled = false

[observability]
log_format = "pretty"
log_level = "${LOG_LEVEL:-info}"
