# PCS standalone service configuration, built-in factories only.
#
# Run:
#   cargo run --features service,wasm --bin pcs-service -- validate \
#     --config examples/configs/standalone.toml
#   cargo run --features service,wasm --bin pcs-service -- serve \
#     --config examples/configs/standalone.toml
#
# The pipeline reads examples/configs/fixtures/orders.csv, runs a WASM guest
# component, and writes /tmp/pcs-standalone-orders-out.csv. If you change that
# path, create the parent directory first.
#
# Components and systems have no TOML representation: the guest declares them
# through `describe()`. See crates/pcs-service/src/service/registry.rs.

# Single process, no distributed coordination.
mode = "standalone"

[node]
id = 1
name = "pcs-standalone"
data_dir = "${PCS_DATA_DIR:-/tmp/pcs-standalone}"

# Paces repeated iterations: one_shot, continuous, or interval every N ms.
# Defaults to continuous.
[run_mode]
kind = "one_shot"

# The guest's `describe()` response supplies the component list, so the
# `target_component` and `source_component` keys below must name components it
# declares. Build the module with
# `cargo component build --release --target wasm32-wasip2`.
[pipeline.wasm]
module = "pipelines/orders.wasm"

# Sources feed rows into component columns before the pipeline runs. CsvSource
# requires path and schema_fields; has_headers defaults to true.
[[sources]]
name = "csv_orders"
type = "CsvSource"
target_component = "orders"

[sources.config]
path = "examples/configs/fixtures/orders.csv"
has_headers = true

[[sources.config.schema_fields]]
name = "id"
type = "Int64"
nullable = false

[[sources.config.schema_fields]]
name = "amount"
type = "Float64"
nullable = true

[[sources.config.schema_fields]]
name = "status"
type = "Utf8"
nullable = true

# Sinks drain rows from component columns after the pipeline finishes. CsvSink
# requires path and schema_fields; has_headers defaults to true.
#
# CsvSink creates the output file as soon as the factory is built, including
# during `validate`, so the parent directory must already exist.
[[sinks]]
name = "csv_out"
type = "CsvSink"
source_component = "orders"

[sinks.config]
path = "/tmp/pcs-standalone-orders-out.csv"
has_headers = true

[[sinks.config.schema_fields]]
name = "id"
type = "Int64"
nullable = false

[[sinks.config.schema_fields]]
name = "amount"
type = "Float64"
nullable = true

[[sinks.config.schema_fields]]
name = "status"
type = "Utf8"
nullable = true

# HTTP control plane: /health and /metrics. Port 0 takes an ephemeral port.
[http]
bind = "127.0.0.1:0"
disabled = false

[observability]
log_format = "pretty"   # use "json" in production log aggregators
log_level = "info"
