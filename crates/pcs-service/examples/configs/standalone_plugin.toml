# PCS standalone config running the native plugin fixture from
# `crates/pcs-plugin-smoketest/` under `pcs-service`.
#
# The paths below are CWD-relative, so start from crates/pcs-service:
#   cd crates/pcs-service
#   cargo build -p pcs-plugin-smoketest
#   cargo run --features service,plugin --bin pcs-service -- validate \
#     --config examples/configs/standalone_plugin.toml --strict
#   cargo run --features service,plugin --bin pcs-service -- serve \
#     --config examples/configs/standalone_plugin.toml
#
# It reads examples/configs/fixtures/counter_input.csv, runs the plugin, and
# writes /tmp/pcs-counter-out.csv with `seen` filled in.
#
# A native plugin runs in-process with full host privileges and cannot be
# preempted, so `library` is an operator-trusted path. Set `sha3_256` to pin the
# exact artifact; the service refuses to start when the file's digest differs.

mode = "standalone"

[node]
id = 1
name = "pcs-counter-plugin"
data_dir = "${PCS_DATA_DIR:-/tmp/pcs-counter-plugin}"

[run_mode]
kind = "one_shot"

# A cdylib's file name is platform specific: libpcs_plugin_smoketest.so on
# Linux, libpcs_plugin_smoketest.dylib on macOS, pcs_plugin_smoketest.dll on
# Windows. Override PCS_PLUGIN_LIB to pick another one.
[pipeline.plugin]
library = "${PCS_PLUGIN_LIB:-../../target/debug/libpcs_plugin_smoketest.so}"

# Read by the plugin through the host's `get_config` callback. Strings; the
# plugin parses them with `pcs_config_parse`.
[pipeline.plugin.config]
"smoketest.multiplier" = "1"

# `target_component` must be "Counter": `validate_io_coverage` checks it against
# the component names the plugin reports from `describe`.
[[sources]]
name = "csv_counters"
type = "CsvSource"
target_component = "Counter"

[sources.config]
path = "examples/configs/fixtures/counter_input.csv"
has_headers = true

[[sources.config.schema_fields]]
name = "id"
type = "Int64"
nullable = false

[[sources.config.schema_fields]]
name = "seen"
type = "Int64"
nullable = false

[[sinks]]
name = "csv_out"
type = "CsvSink"
source_component = "Counter"

[sinks.config]
path = "/tmp/pcs-counter-out.csv"
has_headers = true

[[sinks.config.schema_fields]]
name = "id"
type = "Int64"
nullable = false

[[sinks.config.schema_fields]]
name = "seen"
type = "Int64"
nullable = false

[http]
bind = "127.0.0.1:0"
disabled = false

[observability]
log_format = "pretty"
log_level = "info"
