# PCS standalone config running the Rust guest from
# `examples/wasm/order_processing/` under `pcs-service`.
#
# The paths below are CWD-relative, so start from crates/pcs-service:
#   cd crates/pcs-service
#   cargo component build --release -p order-processing-wasm --target wasm32-wasip2
#   cargo run --features service,wasm --bin pcs-service -- validate \
#     --config examples/configs/standalone_wasm.toml --strict
#   cargo run --features service,wasm --bin pcs-service -- serve \
#     --config examples/configs/standalone_wasm.toml
#
# It reads examples/configs/fixtures/order_processing_input.csv, runs the guest,
# and writes /tmp/pcs-order-processing-out.csv with `valid` and `usd_amount`
# filled in.
#
# The guest has no ingest system: rows arrive in the host's `run-batch` Arrow
# IPC payload, which is what the CSV source below produces. It also cannot add
# columns, so every `Transaction` field appears in both schema_fields blocks and
# in the fixture. `valid` is seeded false and `usd_amount` zero; the guest
# overwrites both. Neither may be blank: CsvSource turns an empty field into a
# NULL, the fields are declared non-nullable, and one blank cell fails the whole
# batch.

mode = "standalone"

[node]
id = 1
name = "pcs-order-processing"
data_dir = "${PCS_DATA_DIR:-/tmp/pcs-order-processing}"

[run_mode]
kind = "one_shot"

# A `--target wasm32-wasip2` build lands under `target/wasm32-wasip1/`:
# cargo-component compiles the core module for wasip1 and adapts it into a
# wasip2 component, keeping the pre-adapter directory name.
[pipeline.wasm]
module = "../../target/wasm32-wasip1/release/order_processing_wasm.wasm"

# FX rates the guest reads through the host-io `get-config` import, one key per
# non-USD currency. Strings; the guest parses them with `pcs_config_parse`.
[pipeline.wasm.config]
fx_eur = "1.08"
fx_gbp = "1.27"
fx_jpy = "0.0067"
fx_cad = "0.74"

# `target_component` must be "Transaction": `validate_io_coverage` checks it
# against the component names the guest reports from `describe()`.
[[sources]]
name = "csv_orders"
type = "CsvSource"
target_component = "Transaction"

[sources.config]
path = "examples/configs/fixtures/order_processing_input.csv"
has_headers = true

[[sources.config.schema_fields]]
name = "id"
type = "UInt64"
nullable = false

[[sources.config.schema_fields]]
name = "amount"
type = "Float64"
nullable = false

[[sources.config.schema_fields]]
name = "currency"
type = "Utf8"
nullable = false

[[sources.config.schema_fields]]
name = "valid"
type = "Boolean"
nullable = false

[[sources.config.schema_fields]]
name = "usd_amount"
type = "Float64"
nullable = false

[[sinks]]
name = "csv_out"
type = "CsvSink"
source_component = "Transaction"

[sinks.config]
path = "/tmp/pcs-order-processing-out.csv"
has_headers = true

[[sinks.config.schema_fields]]
name = "id"
type = "UInt64"
nullable = false

[[sinks.config.schema_fields]]
name = "amount"
type = "Float64"
nullable = false

[[sinks.config.schema_fields]]
name = "currency"
type = "Utf8"
nullable = false

[[sinks.config.schema_fields]]
name = "valid"
type = "Boolean"
nullable = false

[[sinks.config.schema_fields]]
name = "usd_amount"
type = "Float64"
nullable = false

[http]
bind = "127.0.0.1:0"
disabled = false

[observability]
log_format = "pretty"
log_level = "info"
