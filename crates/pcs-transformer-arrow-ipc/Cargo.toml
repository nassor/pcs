[package]
name = "pcs-transformer-arrow-ipc"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
description = "The arrow-ipc byte format for PCS: a Transformer carrying one whole RecordBatch per message, and one Arrow IPC stream per byte stream."

[dependencies]
pcs-core        = { path = "../pcs-core", version = "0.1.0" }
pcs-transformer = { path = "../pcs-transformer", version = "0.1.0" }

arrow-array   = { workspace = true }
# The payload format. Exact-pinned workspace-wide.
arrow-ipc     = { workspace = true }
arrow-schema  = { workspace = true }
# `concat_batches` folds a multi-batch payload window into one batch.
arrow-select  = { workspace = true }

[dev-dependencies]
tempfile      = { workspace = true }
