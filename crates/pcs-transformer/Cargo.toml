[package]
name = "pcs-transformer"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
description = "The transformer contract: byte formats PCS connectors read and write."

[dependencies]
pcs-core     = { path = "../pcs-core", version = "0.1.0" }

arrow-array  = { workspace = true }
arrow-schema = { workspace = true }
# `ConfigValue` is part of the factory signature, so every transformer and the
# host that loads it must agree on one version of this crate.
pcs-config   = { path = "../pcs-config", version = "0.1.0" }

[dev-dependencies]
tempfile     = { workspace = true }
