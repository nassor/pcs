base_url = "https://nassor.github.io/pcs"
title = "PCS Documentation"
description = "Distributed Batch Processing for Rust, on Apache Arrow."
default_language = "en"
compile_sass = false
build_search_index = false
generate_feeds = false

# Output to docs/public so GitHub Pages workflow can upload it.
output_dir = "public"

# Pretty URLs (default true): /world.md → /world/
[markdown]
render_emoji = false

# Class mode keeps the inline `style` attribute off `<pre>`, so the site's own
# light/dark rules and the `data-theme` toggle still paint the code frame.
# Zola writes a `giallo.css` for the theme below; no page links it, because the
# Prism `.token.*` rules in `styles.css` colour the tokens. The section exists
# so a fence annotation such as ```rust,name=The build script reaches the page
# as `data-name`, which `script.js` renders as the frame caption.
[markdown.highlighting]
theme = "ayu-dark"
style = "class"

[extra]
github_repo = "https://github.com/nassor/pcs"
crates_io = "https://crates.io/crates/pcs"
docs_rs = "https://docs.rs/pcs"

