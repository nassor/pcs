[package]
name = "branching-wasm"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# A sample processor component, not a library a downstream consumer would
# depend on.
publish = false
description = "Routing demo processor component: decides per batch which branch link its output is delivered to."

# This is a processor pipeline component, NOT a binary. `cargo build --target wasm32-wasip2`
# links the cdylib straight into a Component Model component exporting the
# pcs-pipeline world from pcs-processor's WIT package.
[lib]
crate-type = ["cdylib"]

[dependencies]
pcs-processor = { path = "../../../crates/pcs-processor" }
serde = { workspace = true }

# The bindings generator. Gated on wasm32 because `src/lib.rs` gates the
# generated module the same way: the host build of this crate is an empty cdylib
# and has no use for the generator or its proc-macro dependency tree.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen = { workspace = true }
