# Node 1 — bootstrap node + generator
node_id: 1
listen: "0.0.0.0:9001"
bootstrap: true
data_dir: /data/node1
output_dir: /data/output/node1
peers:
  - "node2:9002"
  - "node3:9003"
log_json: true
generator_interval_secs: 10
# The shared work pool. Every node needs the same two values.
pd_endpoints:
  - "pd:2379"
key_prefix: fulfillment
