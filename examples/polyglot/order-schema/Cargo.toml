[package]
name = "pcs-polyglot-order"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Canonical Order component shared by every stage of the polyglot example."

[dependencies]
# `default-features = false` with no features is deliberate: pcs-core gates only
# on `runtime` / `not(runtime)`, so this crate compiles standalone, and cargo's
# feature unification hands it `runtime` inside the host driver and `guest`
# inside the wasm32-wasip2 stage build with no behaviour switch either way.
pcs-core     = { path = "../../../crates/pcs-core", default-features = false }
arrow-schema = { workspace = true }
serde        = { workspace = true }
