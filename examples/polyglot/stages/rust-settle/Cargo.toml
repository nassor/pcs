[package]
name = "polyglot-settle-wasm"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Stage 4 of the polyglot example: the Rust guest that writes `settlement` and keeps a cross-batch ledger."

# This is a guest pipeline component, NOT a binary. cargo-component wraps the
# cdylib into a valid Component Model component targeting the pcs-pipeline
# world from pcs-guest's WIT package.
[lib]
crate-type = ["cdylib"]

[dependencies]
pcs-guest          = { path = "../../../../crates/pcs-guest" }
pcs-polyglot-order = { path = "../../order-schema" }
serde              = { workspace = true }
# cargo-component generates src/bindings.rs against the WIT target and
# requires this runtime crate at link time.
wit-bindgen-rt     = { version = "0.44.0", features = ["bitflags"] }

[package.metadata.component]
package = "pcs:polyglot-settle"

[package.metadata.component.target]
path = "../../../../crates/pcs-guest/wit"
world = "pcs-pipeline"
