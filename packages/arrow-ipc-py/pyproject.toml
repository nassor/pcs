[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pcs-arrow-ipc"
version = "0.1.0"
description = "Arrow IPC codec for PCS WebAssembly guests: standard library only, no pyarrow."
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"

[tool.hatch.build.targets.wheel]
packages = ["src/pcs_arrow_ipc"]
