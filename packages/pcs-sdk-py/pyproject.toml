[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pcs-sdk"
version = "0.1.0"
description = "Zero-ceremony PCS processors in Python: one dataclass, one transform function."
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["src/pcs_sdk"]
